name: Windows Release

# Builds a Windows x64 TIMEditor.exe and publishes it as a GitHub Release
# whenever a "v*" tag is pushed (e.g. v0.1.0). Can also be run manually from
# the Actions tab (workflow_dispatch) to sanity-check the build without
# cutting a release - that run only uploads a build artifact, it doesn't
# publish anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to a GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # windows-latest ships a pre-cloned vcpkg at %VCPKG_INSTALLATION_ROOT%
      # (usually C:\vcpkg) - this just installs the one dependency the repo
      # doesn't vendor itself (see docs/ARCHITECTURE.md's dependency table).
      - name: Install GLFW via vcpkg
        run: vcpkg install glfw3:x64-windows

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DTIMEDITOR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run tests
        working-directory: build
        run: ctest -C Release --output-on-failure

      # TIMEditor.exe is the only thing this repo's own build produces that
      # needs shipping - nfd/imgui/stb/tinygltf/ImGuizmo are all compiled
      # directly into it (see CMakeLists.txt). glfw3.dll (vcpkg's dynamic
      # triplet) is the one runtime dependency that has to travel alongside
      # it; OpenGL (opengl32.dll) is part of Windows itself.
      - name: Package
        run: |
          $dist = "dist/TIMEditor-windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/Release/TIMEditor.exe $dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/glfw3.dll" $dist/
          Copy-Item README.md $dist/
          Compress-Archive -Path "$dist/*" -DestinationPath TIMEditor-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIMEditor-windows-x64
          path: TIMEditor-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TIMEditor-windows-x64.zip
          generate_release_notes: true
